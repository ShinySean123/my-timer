<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 讀書專用計時器</title>
    <style>
        :root {
            --primary: #2980b9;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --gray: #95a5a6;
            --bg: #ecf0f1;
            --info-bg: #dff9fb;
            --info-text: #130f40;
        }

        body {
            font-family: "微軟正黑體", sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 420px;
        }

        h2 { color: var(--dark); margin-bottom: 20px; }

        .input-group {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: var(--dark);
        }

        input[type="number"] {
            width: 60px;
            padding: 8px;
            font-size: 1.1rem;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 5px;
        }

        /* 預測資訊區塊 */
        .prediction-box {
            background-color: var(--info-bg);
            color: var(--info-text);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 0.95rem;
            line-height: 1.6;
            border-left: 5px solid var(--primary);
            text-align: left;
        }

        .prediction-box span { font-weight: bold; color: var(--primary); }

        #countdown-display {
            font-size: 4.5rem;
            font-weight: bold;
            color: var(--dark);
            margin: 10px 0;
            font-family: Arial, sans-serif;
        }

        /* 進度條與經過時間 */
        .status-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.95rem;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
        }

        .highlight-text { font-weight: bold; color: #e67e22; }
        .progress-text { font-weight: bold; color: var(--primary); }

        .btn-group { display: flex; gap: 10px; flex-direction: column; }
        .row { display: flex; gap: 10px; }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: background 0.2s;
            font-weight: bold;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-start { background-color: var(--primary); color: white; }
        .btn-stop { background-color: var(--danger); color: white; }
        .btn-reset { background-color: var(--gray); color: white; }
        
        audio { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>📖 Slide 專注閱讀系統</h2>

    <div class="input-group">
        單張耗時：
        <input type="number" id="min-input" value="1" min="0"> 分
        <input type="number" id="sec-input" value="0" min="0" max="59"> 秒
    </div>
    <div class="input-group">
        總投影片：
        <input type="number" id="slide-input" value="20" min="1"> 張
    </div>
    
    <div style="font-size: 0.8rem; color: #666; margin-bottom: 10px;">
        自訂鈴聲：<input type="file" id="audio-file" accept="audio/*">
    </div>

    <div class="prediction-box">
        預計總耗時：<span id="est-total-time">0 小時 20 分鐘 0 秒</span><br>
        預計結束於：<span id="est-end-time">計算中...</span>
    </div>

    <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">

    <div style="color: #7f8c8d; font-size: 0.9rem;">目前 Slide 剩餘時間</div>
    <div id="countdown-display">00:00</div>

    <div class="status-box">
        <div class="status-row">
            <span>📚 閱讀進度：</span>
            <span class="progress-text" id="slide-progress">0 / 20 張</span>
        </div>
        <div class="status-row">
            <span>⏱️ 累計總時間：</span>
            <span class="highlight-text" id="elapsed-display">00:00:00</span>
        </div>
    </div>

    <div class="btn-group">
        <div class="row">
            <button class="btn-start" id="start-btn" onclick="startTimer()">開始閱讀</button>
            <button class="btn-stop" id="stop-btn" onclick="stopTimer()" disabled>暫停</button>
        </div>
        <button class="btn-reset" onclick="resetSystem()">重置系統</button>
    </div>
</div>

<audio id="bell-player" src="bell.mp3"></audio>

<script>
    let timerInterval;
    let secondsPerSlide = 0;
    let totalSlides = 0;
    let remainingSeconds = 0;
    let elapsedSeconds = 0;
    let currentSlideCount = 0; // 已讀完的張數
    let isRunning = false;
    let isPaused = false;

    // DOM 元素綁定
    const minInput = document.getElementById('min-input');
    const secInput = document.getElementById('sec-input');
    const slideInput = document.getElementById('slide-input');
    
    const estTotalTimeEl = document.getElementById('est-total-time');
    const estEndTimeEl = document.getElementById('est-end-time');
    
    const countdownEl = document.getElementById('countdown-display');
    const elapsedEl = document.getElementById('elapsed-display');
    const slideProgressEl = document.getElementById('slide-progress');
    
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const audioFileInput = document.getElementById('audio-file');
    const bellPlayer = document.getElementById('bell-player');

    // 綁定輸入框事件：只要數字改變，就即時重新計算結束時間
    [minInput, secInput, slideInput].forEach(input => {
        input.addEventListener('input', calculateEstimation);
    });

    // 處理自訂音訊
    audioFileInput.onchange = function() {
        const file = this.files[0];
        if (file) {
            bellPlayer.src = URL.createObjectURL(file);
        }
    };

    function playBell() {
        if (bellPlayer.src && bellPlayer.src !== "" && !bellPlayer.src.endsWith(window.location.pathname)) {
            bellPlayer.currentTime = 0;
            let playPromise = bellPlayer.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => playBeepFallback());
            }
        } else {
            playBeepFallback();
        }
    }

    function playBeepFallback() {
        const context = new (window.AudioContext || window.webkitAudioContext)();
        const osc = context.createOscillator();
        const gain = context.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, context.currentTime);
        gain.gain.setValueAtTime(0.5, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 1);
        osc.connect(gain);
        gain.connect(context.destination);
        osc.start();
        osc.stop(context.currentTime + 1);
    }

    function formatTime(s, showHours = false) {
        const hrs = Math.floor(s / 3600);
        const mins = Math.floor((s % 3600) / 60);
        const secs = s % 60;
        if (showHours) return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // --- 核心功能：計算預計總耗時與結束時間 ---
    function calculateEstimation() {
        if (isRunning) return; // 正在計時中不更新預測

        const m = parseInt(minInput.value) || 0;
        const s = parseInt(secInput.value) || 0;
        const slides = parseInt(slideInput.value) || 0;

        const totalSecondsNeeded = (m * 60 + s) * slides;
        
        if (totalSecondsNeeded <= 0) {
            estTotalTimeEl.innerText = "0 小時 0 分鐘 0 秒";
            estEndTimeEl.innerText = "請設定有效時間";
            return;
        }

        // 格式化預計總耗時
        const h = Math.floor(totalSecondsNeeded / 3600);
        const min = Math.floor((totalSecondsNeeded % 3600) / 60);
        const sec = totalSecondsNeeded % 60;
        estTotalTimeEl.innerText = `${h} 小時 ${min} 分鐘 ${sec} 秒`;

        // 格式化預計結束時間 (YYYY-MM-DD HH:MM:SS)
        const now = new Date();
        const endTime = new Date(now.getTime() + totalSecondsNeeded * 1000);
        
        const yyyy = endTime.getFullYear();
        const mm = String(endTime.getMonth() + 1).padStart(2, '0');
        const dd = String(endTime.getDate()).padStart(2, '0');
        const hh = String(endTime.getHours()).padStart(2, '0');
        const minOut = String(endTime.getMinutes()).padStart(2, '0');
        const ss = String(endTime.getSeconds()).padStart(2, '0');

        estEndTimeEl.innerText = `${yyyy}年${mm}月${dd}日 ${hh}:${minOut}:${ss}`;
    }

    function startTimer() {
        const m = parseInt(minInput.value) || 0;
        const s = parseInt(secInput.value) || 0;
        totalSlides = parseInt(slideInput.value) || 0;
        const newSecondsPerSlide = m * 60 + s;

        if (newSecondsPerSlide <= 0 || totalSlides <= 0) {
            alert("請設定正確的時間與投影片張數！");
            return;
        }

        // 如果是全新開始，或是修改了設定，就套用新設定
        if (!isPaused || secondsPerSlide !== newSecondsPerSlide) {
            secondsPerSlide = newSecondsPerSlide;
            remainingSeconds = secondsPerSlide;
            currentSlideCount = 0; // 進度歸零
            slideProgressEl.innerText = `0 / ${totalSlides} 張`;
            calculateEstimation(); // 開始的瞬間鎖定預測時間
        }

        // 檢查是否已經讀完所有 Slide，如果讀完就重置進度
        if (currentSlideCount >= totalSlides) {
            currentSlideCount = 0;
            remainingSeconds = secondsPerSlide;
        }

        isRunning = true;
        isPaused = false;
        
        startBtn.disabled = true;
        stopBtn.disabled = false;
        minInput.disabled = true;
        secInput.disabled = true;
        slideInput.disabled = true;

        countdownEl.innerText = formatTime(remainingSeconds);

        timerInterval = setInterval(() => {
            elapsedSeconds++;
            elapsedEl.innerText = formatTime(elapsedSeconds, true);

            if (remainingSeconds <= 0) {
                playBell();
                currentSlideCount++;
                slideProgressEl.innerText = `${currentSlideCount} / ${totalSlides} 張`;

                if (currentSlideCount >= totalSlides) {
                    // 所有 Slide 讀完了！
                    clearInterval(timerInterval);
                    countdownEl.innerText = "完成!";
                    countdownEl.style.color = "var(--primary)";
                    isRunning = false;
                    isPaused = false;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    minInput.disabled = false;
                    secInput.disabled = false;
                    slideInput.disabled = false;
                    setTimeout(() => alert("恭喜！你已經讀完所有設定的投影片！"), 500);
                    return;
                } else {
                    // 進入下一張 Slide
                    remainingSeconds = secondsPerSlide;
                    countdownEl.style.color = 'var(--danger)';
                    setTimeout(() => countdownEl.style.color = 'var(--dark)', 500);
                }
            } else {
                remainingSeconds--;
            }
            countdownEl.innerText = formatTime(remainingSeconds);
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        isPaused = true;
        startBtn.innerText = "繼續閱讀";
        startBtn.disabled = false;
        stopBtn.disabled = true;
        minInput.disabled = false;
        secInput.disabled = false;
        slideInput.disabled = false;
    }

    function resetSystem() {
        clearInterval(timerInterval);
        elapsedSeconds = 0;
        currentSlideCount = 0;
        isRunning = false;
        isPaused = false;
        
        elapsedEl.innerText = "00:00:00";
        countdownEl.innerText = "00:00";
        countdownEl.style.color = "var(--dark)";
        startBtn.innerText = "開始閱讀";
        
        startBtn.disabled = false;
        stopBtn.disabled = true;
        minInput.disabled = false;
        secInput.disabled = false;
        slideInput.disabled = false;
        
        slideProgressEl.innerText = `0 / ${slideInput.value || 0} 張`;
        calculateEstimation(); // 重置時重新試算時間
    }

    // 網頁載入時先執行一次時間預估
    calculateEstimation();
</script>

</body>
</html>
